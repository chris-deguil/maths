project:
  type: website
  resources:
    - assets/**

website:
  title: "Mathématiques — Christophe Deguil"
  description: "Cours, activités, exercices et ressources de mathématiques pour le lycée."

  site-url: https://chris-deguil.github.io/maths/
  repo-url: https://github.com/chris-deguil/maths

  page-navigation: true
  bread-crumbs: true
  search: true
  back-to-top-navigation: true

  page-footer:
    left: "© 2026 — Christophe Deguil"
    right:
      - text: "Accueil"
        href: index.qmd
      - text: "Contact"
        href: mailto:christophe.Deguil@ac-versailles.fr

  navbar:
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Seconde"
        href: seconde-maths/index.qmd
      - text: "Première"
        href: premiere-maths/index.qmd
      - text: "Terminale"
        href: terminale-maths/index.qmd

    right:
      - icon: github
        href: https://github.com/chris-deguil/maths
        aria-label: "Dépôt GitHub"

  sidebar:
    - title: "Seconde"
      logo: assets/images/logo_maths2.png
      style: docked
      collapse-level: 1
      contents:
        - seconde-maths/index.qmd

        - section: "Chapitre 1 : Ensembles de nombres"
          contents:
            - seconde-maths/ensembles_nombres/index.qmd
            - seconde-maths/ensembles_nombres/vocabulaire.qmd
            - seconde-maths/ensembles_nombres/entiers.qmd
            - seconde-maths/ensembles_nombres/rationnels_decimaux.qmd
            - seconde-maths/ensembles_nombres/reels_irrationnels.qmd
            - seconde-maths/ensembles_nombres/fractions.qmd
            - seconde-maths/ensembles_nombres/puissances.qmd
            - seconde-maths/ensembles_nombres/notation_scientifique.qmd

        - section: "Chapitre 2 : Fonctions affines"
          contents:
            - seconde-maths/fonctions_affines/index.qmd
            - seconde-maths/fonctions_affines/vocabulaire_fonctions.qmd
            - seconde-maths/fonctions_affines/definition_fonction_affine.qmd
            - seconde-maths/fonctions_affines/determiner_expression.qmd
            - seconde-maths/fonctions_affines/representation_graphique.qmd
            - seconde-maths/fonctions_affines/appartenance_droite.qmd
            - seconde-maths/fonctions_affines/variations.qmd
            - seconde-maths/fonctions_affines/resolution_equations.qmd
            - seconde-maths/fonctions_affines/fonctions_par_morceaux.qmd
            - seconde-maths/fonctions_affines/synthese.qmd

        - section: "Chapitre 3 : Vecteurs — Translation"
          contents:
            - seconde-maths/vecteurs_translation/index.qmd
            - seconde-maths/vecteurs_translation/translation_vecteur.qmd
            - seconde-maths/vecteurs_translation/vecteurs_egaux.qmd
            - seconde-maths/vecteurs_translation/somme_vecteurs.qmd
            - seconde-maths/vecteurs_translation/relation_chasles.qmd
            - seconde-maths/vecteurs_translation/identite_parallelogramme.qmd
            - seconde-maths/vecteurs_translation/vecteur_oppose.qmd
            - seconde-maths/vecteurs_translation/produit_reel.qmd
            - seconde-maths/vecteurs_translation/milieu_segment.qmd
            - seconde-maths/vecteurs_translation/vecteurs_colineaires.qmd
            - seconde-maths/vecteurs_translation/alignement_parallelisme.qmd
            - seconde-maths/vecteurs_translation/bilan.qmd

    - title: "Première"
      logo: assets/images/logo_maths2.png
      style: docked
      collapse-level: 1
      contents:
        - premiere-maths/index.qmd

    - title: "Terminale"
      logo: assets/images/logo_maths2.png
      style: docked
      collapse-level: 1
      contents:
        - terminale-maths/index.qmd

format:
  html:
    include-in-header:
      - assets/set-html-class.html
      - assets/mathjax-macros.html

    filters:
      - assets/exercise-counter.lua
      - assets/auto-nav.lua

    theme:
      light: [cosmo, assets/css/general.scss]
      dark: [darkly, assets/css/general.scss]

    grid:
      body-width: 1400px
      margin-width: 18rem
      sidebar-width: 16rem
      gutter-width: 1.5rem

    toc: true
    toc-depth: 3
    smooth-scroll: true

    mermaid:
      theme: forest

execute:
  freeze: auto
