format:
  html:
    include-in-header:
      - assets/set-html-class.html
      - assets/mathjax-macros.html

    filters:
      - assets/exercise-counter.lua
      - assets/auto-nav.lua

    theme:
      light: [cosmo, assets/css/general.scss]
      dark: [darkly, assets/css/general.scss]

    grid:
      body-width: 1400px
      margin-width: 18rem
      sidebar-width: 16rem
      gutter-width: 1.5rem

    toc: true
    toc-depth: 3
    smooth-scroll: true

    mermaid:
      theme: forest

execute:
  freeze: auto
